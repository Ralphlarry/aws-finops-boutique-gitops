apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Ralphlarry/aws-finops-boutique-gitops.git"
    targetRevision: HEAD
    path: applications/online-boutique
  destination:
    server: "https://kubernetes.default.svc"
    namespace: boutique-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
