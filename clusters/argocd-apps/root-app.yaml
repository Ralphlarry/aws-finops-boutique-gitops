apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Ralphlarry/aws-finops-boutique-gitops.git"
    targetRevision: HEAD
    path: clusters/argocd-apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
